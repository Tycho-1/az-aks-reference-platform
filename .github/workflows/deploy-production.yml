name: deploy-production

# Plan on every PR and push to main; apply the reviewed plan on main after environment approval.
# Authentication is OpenID Connect to user-assigned managed identities (bootstrap/github-actions-identity):
# no Azure secrets are stored in GitHub.
#
# Both jobs skip while AZURE_TENANT_ID is empty. Set that variable, plus the other GitHub
# variables in bootstrap/github-actions-identity/README.md, and the next run plans for real.
# An empty tenant is the switch; the storage account and client IDs still have to be set
# or terraform init fails.

on:
  pull_request:
    paths:
      - modules/**
      - environments/prod/**
      - .github/workflows/deploy-production.yml
  push:
    branches: [main]
    paths:
      - modules/**
      - environments/prod/**
      - .github/workflows/deploy-production.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-production
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  ARM_USE_OIDC: "true"
  ARM_USE_AZUREAD: "true"
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  WORKING_DIR: environments/prod

jobs:
  plan:
    # Empty until bootstrap/github-actions-identity is applied and AZURE_TENANT_ID is set.
    if: vars.AZURE_TENANT_ID != ''
    # The Key Vaults and API server are private: use a self-hosted runner inside the network
    # (set the TERRAFORM_RUNNER variable) for real deployments.
    runs-on: ${{ vars.TERRAFORM_RUNNER || 'ubuntu-latest' }}
    environment: production-plan
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    env:
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
    outputs:
      has_changes: ${{ steps.plan.outputs.has_changes }}
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          # Exact CLI, same as the minimum version in terraform.yml. ~1.11 could
          # install a different 1.11 patch for plan than for apply.
          terraform_version: "1.11.0"
          terraform_wrapper: false

      - name: Write variables
        env:
          TFVARS: ${{ secrets.TFVARS_PRODUCTION }}
        run: printf '%s\n' "$TFVARS" > terraform.tfvars

      - name: terraform init
        run: >-
          terraform init
          -backend-config="resource_group_name=${{ vars.TFSTATE_RESOURCE_GROUP }}"
          -backend-config="storage_account_name=${{ vars.TFSTATE_STORAGE_ACCOUNT }}"
          -backend-config="container_name=${{ vars.TFSTATE_CONTAINER }}"
          -backend-config="key=prod.tfstate"
          -backend-config="use_azuread_auth=true"
          -backend-config="use_oidc=true"

      - name: terraform plan
        id: plan
        run: |
          set +e
          terraform plan -lock-timeout=10m -detailed-exitcode -out=tfplan
          code=$?
          set -e
          if [ "$code" -eq 1 ]; then exit 1; fi
          echo "has_changes=$([ "$code" -eq 2 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          terraform show -no-color tfplan > plan.txt

      - name: Comment plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- terraform-plan-production -->';
            let plan = fs.readFileSync('${{ env.WORKING_DIR }}/plan.txt', 'utf8');
            if (plan.length > 60000) plan = plan.slice(0, 60000) + '\n... (truncated, see the workflow logs)';
            const body = `${marker}\n### Terraform plan: production\n<details><summary>Show plan</summary>\n\n\`\`\`terraform\n${plan}\n\`\`\`\n</details>`;
            const { data: comments } = await github.rest.issues.listComments({ ...context.repo, issue_number: context.issue.number });
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            }

      - name: Upload plan
        if: github.event_name != 'pull_request' && steps.plan.outputs.has_changes == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tfplan-production
          path: ${{ env.WORKING_DIR }}/tfplan
          retention-days: 1

  apply:
    needs: plan
    if: vars.AZURE_TENANT_ID != '' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.plan.outputs.has_changes == 'true'
    runs-on: ${{ vars.TERRAFORM_RUNNER || 'ubuntu-latest' }}
    # Protect this environment with required reviewers and a main-only deployment branch rule.
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          # Exact CLI, same as the minimum version in terraform.yml. ~1.11 could
          # install a different 1.11 patch for plan than for apply.
          terraform_version: "1.11.0"
          terraform_wrapper: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tfplan-production
          path: ${{ env.WORKING_DIR }}

      - name: terraform init
        run: >-
          terraform init
          -backend-config="resource_group_name=${{ vars.TFSTATE_RESOURCE_GROUP }}"
          -backend-config="storage_account_name=${{ vars.TFSTATE_STORAGE_ACCOUNT }}"
          -backend-config="container_name=${{ vars.TFSTATE_CONTAINER }}"
          -backend-config="key=prod.tfstate"
          -backend-config="use_azuread_auth=true"
          -backend-config="use_oidc=true"

      # Applies exactly the reviewed plan; fails safely if the state changed since planning.
      - name: terraform apply
        run: terraform apply -lock-timeout=10m tfplan
